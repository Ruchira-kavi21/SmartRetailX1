services:

  mysql:
    image: mysql:8.0
    container_name: smartretailx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  auth-service:
    build:
      context: ./auth-service
    container_name: smartretailx-auth-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/auth_db
      JWT_SECRET: change-this-development-secret
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      - mysql

  product-service:
    build:
      context: ./product-service
    container_name: smartretailx-product-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: product_db
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/product_db
      PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      - mysql

  order-service:
    build:
      context: ./order-service
    container_name: smartretailx-order-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: order_db
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/order_db
      PORT: 5003
    ports:
      - "5003:5003"
    depends_on:
      - mysql

  inventory-service:
    build:
      context: ./inventory-service
    container_name: smartretailx-inventory-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/inventory_db
      PORT: 5004
    ports:
      - "5004:5004"
    depends_on:
      - mysql
volumes:
  mysql_data: